<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 930" role="img" aria-labelledby="overview-title"><title id="overview-title">Связи пяти биомов и Зала дверей</title><defs><marker id="overview-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#9b3545"/></marker></defs><style>.overview-edge text{paint-order:stroke;stroke:#fffdf8;stroke-width:6px;stroke-linejoin:round}</style><rect width="1300" height="930" fill="#fffdf8"/><g font-family="Arial,sans-serif" font-size="18" fill="#292a2c"><g class="overview-edge main"><path d="M 510 445 C 350 465 250 520 230 615" fill="none" stroke="#767780" stroke-width="2" marker-end="url(#overview-arrow)"/><text x="285" y="490" text-anchor="middle">Спуск в слёзы</text></g><g class="overview-edge return"><path d="M 330 625 C 400 570 480 540 540 480" fill="none" stroke="#9b3545" stroke-width="2" marker-end="url(#overview-arrow)"/><text x="420" y="590" text-anchor="middle">A01 · возврат наверх</text></g><g class="overview-edge main"><path d="M 545 360 C 440 300 350 275 305 240" fill="none" stroke="#767780" stroke-width="2" marker-end="url(#overview-arrow)"/><text x="410" y="302" text-anchor="middle">A01 · к дому Кролика</text></g><g class="overview-edge return"><path d="M 315 235 C 400 265 470 290 570 355" fill="none" stroke="#9b3545" stroke-width="2" marker-end="url(#overview-arrow)"/><text x="590" y="267" text-anchor="middle">R01 · гриб + спуск за гнездом</text></g><g class="overview-edge main"><path d="M 755 360 C 860 290 935 265 990 240" fill="none" stroke="#767780" stroke-width="2" marker-end="url(#overview-arrow)"/><text x="890" y="310" text-anchor="middle">A02 · служебный путь</text></g><g class="overview-edge return"><path d="M 1060 120 V 65 H 230 V 120" fill="none" stroke="#9b3545" stroke-width="2" marker-end="url(#overview-arrow)"/><text x="650" y="48" text-anchor="middle">R02 · после Кухарки: через узел обратно в Чащу</text></g><g class="overview-edge main"><path d="M 75 190 H 30 V 880 H 700 V 865" fill="none" stroke="#767780" stroke-width="2" marker-end="url(#overview-arrow)"/><text x="290" y="865" text-anchor="middle">A03 · исчезнувший мост</text></g><g class="overview-edge return"><path d="M 700 740 C 780 640 790 590 725 480" fill="none" stroke="#9b3545" stroke-width="2" marker-end="url(#overview-arrow)"/><text x="840" y="680" text-anchor="middle">R03 · A04 · галерея</text></g><g class="overview-edge main"><path d="M 770 440 C 850 450 890 500 935 530" fill="none" stroke="#767780" stroke-width="2" marker-end="url(#overview-arrow)"/><text x="1050" y="438" text-anchor="middle">Рычаг калитки из галереи</text></g><g class="overview-node"><rect x="510" y="359" width="260" height="112" rx="8" fill="#fffdf8" stroke="#aba69c"/><text x="640" y="392" text-anchor="middle" font-weight="bold">ЗАЛ ДВЕРЕЙ</text><text x="640" y="420" text-anchor="middle">Общий узел</text><text x="640" y="446" text-anchor="middle" font-size="16">Маленькая дверь · ножницы</text></g><g class="overview-node"><rect x="70" y="624" width="300" height="112" rx="8" fill="#fffdf8" stroke="#aba69c"/><text x="220" y="657" text-anchor="middle" font-weight="bold">01 · НИЖНИЕ ПОКОИ</text><text x="220" y="685" text-anchor="middle">Додо → A01 · веер</text><text x="220" y="711" text-anchor="middle" font-size="16">Мышь · тайники берега</text></g><g class="overview-node"><rect x="75" y="124" width="310" height="112" rx="8" fill="#fffdf8" stroke="#aba69c"/><text x="230" y="157" text-anchor="middle" font-weight="bold">02 · РАЗРОСШАЯСЯ ЧАЩА</text><text x="230" y="185" text-anchor="middle">Гриб A02 → Голубка</text><text x="230" y="211" text-anchor="middle" font-size="16">Сети · скрытые ходы</text></g><g class="overview-node"><rect x="905" y="124" width="310" height="112" rx="8" fill="#fffdf8" stroke="#aba69c"/><text x="1060" y="157" text-anchor="middle" font-weight="bold">03 · ВЛАДЕНИЯ ГЕРЦОГИНИ</text><text x="1060" y="185" text-anchor="middle">Кухарка → A03 · Шаг</text><text x="1