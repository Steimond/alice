<!doctype html>
<html lang="ru" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Alice — дизайн игры и история</title>
  <style>
    :root { --bg:#f2f0eb; --paper:#fffefb; --ink:#292a2c; --muted:#70706c; --line:#e1ddd5; --accent:#9b3545; --wash:#f5e9e8; --code:#efede8; --side:#202127; --side-ink:#f0ece6; --side-muted:#a7a7ad; --shadow:0 14px 50px #30281a08; color-scheme:light; }
    [data-theme="dark"] { --bg:#191a1f; --paper:#23242b; --ink:#e9e5de; --muted:#b1ada8; --line:#3a3a42; --accent:#f09aa6; --wash:#382b33; --code:#2e3039; --shadow:none; color-scheme:dark; }
    * { box-sizing:border-box; }
    html { scroll-behavior:smooth; scroll-padding-top:100px; }
    body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.78 "Segoe UI",Arial,sans-serif; }
    button,input { font:inherit; }
    button,a,input { -webkit-tap-highlight-color:transparent; }
    a { color:var(--accent); text-underline-offset:4px; }
    a:hover { text-decoration-thickness:2px; }
    button { cursor:pointer; }
    :focus-visible { outline:3px solid #d79b65; outline-offset:4px; }
    [hidden] { display:none!important; }
    .skip { position:fixed; top:-80px; left:24px; z-index:30; padding:10px 16px; background:var(--paper); }
    .skip:focus { top:12px; }
    .sidebar { position:fixed; inset:0 auto 0 0; width:292px; display:flex; flex-direction:column; background:var(--side); color:var(--side-ink); z-index:20; }
    .brand { padding:30px 28px 24px; border-bottom:1px solid #ffffff16; }
    .brand-line { display:flex; align-items:center; gap:11px; }
    .heart { color:#d47c88; font-size:23px; }
    .brand strong { font-size:24px; letter-spacing:5px; font-weight:600; }
    .brand p { margin:8px 0 0; color:var(--side-muted); font-size:12px; letter-spacing:1.5px; text-transform:uppercase; }
    .search-wrap { padding:20px 20px 10px; }
    .search-wrap label { display:block; color:var(--side-muted); font-size:12px; margin:0 0 7px 5px; }
    #search { width:100%; border:1px solid #ffffff28; border-radius:7px; padding:10px 12px; color:var(--side-ink); background:#ffffff08; font-size:14px; }
    #search::placeholder { color:#929298; }
    .nav-scroll { flex:1; min-height:0; overflow:auto; padding:7px 16px 28px; scrollbar-width:thin; }
    .nav-label { margin:18px 12px 8px; color:var(--side-muted); font-size:10px; text-transform:uppercase; letter-spacing:1.8px; }
    .doc-link { display:flex; gap:12px; align-items:center; width:100%; text-align:left; border:0; background:transparent; color:#d7d4d2; padding:10px 12px; border-radius:6px; font-size:14px; line-height:1.4; }
    .doc-link span { font:11px/1.4 Consolas,monospace; color:#999aa1; }
    .doc-link:hover { background:#ffffff08; }
    .doc-link[aria-current="page"] { background:#ffffff12; color:white; box-shadow:inset 2px 0 #d47c88; }
    .doc-link[aria-current="page"] span { color:#e4a8b1; }
    #toc { list-style:none; padding:0; margin:0; }
    #toc a { display:block; text-decoration:none; color:#b9b8bd; font-size:12px; line-height:1.6; padding:6px 12px; border-left:1px solid #ffffff18; margin-left:12px; }
    #toc .sub a { padding-left:22px; color:#98989f; font-size:11px; }
    #toc a:hover,#toc a.active { color:white; border-color:#d47c88; background:#ffffff04; }
    .side-footer { padding:13px 28px; border-top:1px solid #ffffff16; color:var(--side-muted); font-size:11px; display:flex; justify-content:space-between; }
    .status-dot { display:inline-block; width:6px; height:6px; margin-right:7px; background:#d47c88; border-radius:50%; }
    .search-result { display:block; width:100%; text-align:left; border:1px solid #ffffff15; background:#ffffff05; color:#f0ece6; border-radius:6px; padding:11px; margin:9px 0; font-size:13px; }
    .search-result small { display:block; color:#d79ba6; font-size:10px; margin-bottom:4px; }
    .search-result p { margin:5px 0 0; font-size:11px; color:#aeabb0; line-height:1.6; }
    #search-status { color:#b9b8bd; font-size:12px; padding:10px 12px; }
    .shell { margin-left:292px; }
    .toolbar { position:sticky; top:0; z-index:10; height:64px; display:flex; align-items:center; justify-content:space-between; gap:16px; padding:0 38px; border-bottom:1px solid var(--line); background:var(--bg); }
    .breadcrumb { min-width:0; display:flex; align-items:center; gap:13px; color:var(--muted); font-size:12px; }
    .breadcrumb strong { color:var(--ink); font-weight:500; }
    .tools { display:flex; gap:8px; flex-shrink:0; }
    .tool { border:1px solid var(--line); background:var(--paper); color:var(--ink); border-radius:6px; padding:5px 11px; font-size:12px; }
    #menu-toggle { display:none; }
    .progress-track { position:fixed; top:64px; left:292px; right:0; height:2px; z-index:15; background:transparent; }
    #progress { display:block; height:100%; width:0; background:var(--accent); }
    main { max-width:1140px; margin:0 auto; padding:38px 38px 70px; }
    .edition { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:22px; color:var(--muted); font-size:11px; letter-spacing:1.3px; text-transform:uppercase; }
    .edition span:last-child { border:1px solid var(--line); padding:4px 9px; border-radius:4px; letter-spacing:.5px; }
    .document { background:var(--paper); border:1px solid var(--line); border-radius:10px; padding:44px 54px; box-shadow:var(--shadow); }
    .document h1 { margin:0 0 22px; font-family:Georgia,"Times New Roman",serif; font-size:clamp(29px,3vw,43px); line-height:1.2; letter-spacing:-1.3px; font-weight:400; }
    .document h1::before { content:attr(data-kicker); display:block; margin-bottom:17px; font:600 10px/1.5 "Segoe UI",sans-serif; letter-spacing:2px; color:var(--accent); text-transform:uppercase; }
    .document h1 + p { font-size:13px; color:var(--muted); padding-bottom:25px; border-bottom:1px solid var(--line); }
    .document h2 { margin:52px 0 20px; padding-top:22px; border-top:1px solid var(--line); font:400 28px/1.3 Georgia,"Times New Roman",serif; letter-spacing:-.4px; }
    .document h3 { font-size:18px; line-height:1.45; margin:32px 0 13px; font-weight:600; }
    .document p { margin:0 0 18px; }
    .document strong { font-weight:650; }
    .document ul,.document ol { margin:16px 0 22px; padding-left:24px; }
    .document li { padding-left:3px; margin-bottom:8px; }
    .document li::marker { color:var(--accent); }
    .document code { background:var(--code); padding:2px 5px; border-radius:4px; font:12px/1.7 Consolas,monospace; overflow-wrap:anywhere; }
    .document pre { padding:20px; overflow:auto; background:var(--code); border:1px solid var(--line); border-radius:7px; }
    .document pre code { padding:0; overflow-wrap:normal; }
    .document blockquote { margin:24px 0; border-left:3px solid var(--accent); padding:12px 22px; background:var(--wash); }
    .table-scroll { overflow-x:auto; margin:24px 0 30px; border:1px solid var(--line); border-radius:7px; }
    table { border-collapse:collapse; width:100%; text-align:left; font-size:12px; line-height:1.65; }
    th { background:var(--code); font-weight:600; color:var(--ink); }
    th,td { padding:12px 14px; border-bottom:1px solid var(--line); vertical-align:top; min-width:100px; }
    td:first-child { font-weight:500; }
    tr:last-child td { border-bottom:0; }
    tbody tr:hover { background:var(--wash); }
    .route-map { margin:26px 0; border:1px solid var(--line); border-radius:8px; padding:20px; background:var(--bg); }
    .route-map figcaption { font-size:14px; font-weight:600; margin-bottom:17px; }
    .route-map figcaption span { display:block; font-size:11px; color:var(--muted); font-weight:400; }
    .route-map ol { list-style:none; margin:0; padding:0; }
    .route-map li { display:grid; grid-template-columns:1fr minmax(88px,.5fr) 1fr; align-items:center; gap:10px; padding:0; margin:0 0 8px; }
    .route-place { background:var(--paper); border:1px solid var(--line); padding:10px 12px; border-radius:5px; font-size:12px; line-height:1.5; }
    .route-arrow { text-align:center; color:var(--accent); font-size:21px; line-height:1.2; }
    .route-arrow small { display:block; font-size:9px; line-height:1.4; color:var(--muted); }
    .document-footer { margin-top:55px; padding-top:20px; border-top:1px solid var(--line); display:flex; gap:15px; justify-content:space-between; font-size:11px; color:var(--muted); }
    .world-map-figure { margin:24px 0 30px; }
    .world-map-viewport { overflow:auto; background:var(--paper); border:1px solid var(--line); border-radius:7px; }
    .world-map-viewport svg { display:block; width:100%; min-width:var(--map-native-width,920px); height:auto; }
    .world-map-figure figcaption { display:flex; flex-wrap:wrap; justify-content:space-between; gap:8px 20px; margin-top:9px; font-size:11px; color:var(--muted); }
    .world-map-viewport svg text { fill:var(--ink); }
    .world-map-viewport .graph > polygon,.world-map-viewport svg > rect { fill:var(--paper); }
    .world-map-viewport .node polygon,.world-map-viewport .node path,.world-map-viewport .node ellipse { fill:var(--paper); stroke:var(--muted); }
    .world-map-viewport .node.optional polygon,.world-map-viewport .node.optional path { fill:var(--bg); }
    .world-map-viewport .node.portal polygon,.world-map-viewport .node.portal path,.world-map-viewport .node.portal ellipse { fill:var(--code); }
    .world-map-viewport .node.boss polygon,.world-map-viewport .node.boss path { fill:var(--wash); stroke:var(--accent); }
    .world-map-viewport .edge path { stroke:var(--muted); }
    .world-map-viewport .edge polygon { stroke:var(--muted); fill:var(--muted); }
    .world-map-viewport .edge.return path { stroke:var(--accent); }
    .world-map-viewport .edge.return polygon { stroke:var(--accent); fill:var(--accent); }
    .world-map-viewport .edge.shortcut path { stroke:#367967; }
    [data-theme="dark"] .world-map-viewport .edge.shortcut path { stroke:#79bea7; }
    .world-map-viewport .overview-node rect { fill:var(--paper); stroke:var(--muted); }
    .world-map-viewport .overview-edge path { stroke:var(--muted); }
    .world-map-viewport .overview-edge.return path { stroke:var(--accent); }
    .world-map-viewport .overview-edge text { paint-order:stroke; stroke:var(--paper); stroke-width:5px; stroke-linejoin:round; }
    #backdrop { display:none; }
    .target-flash { animation:flash 1.8s ease-out; }
    @keyframes flash { from { background:var(--wash); } to { background:transparent; } }
    @media(min-width:1600px) { .document { padding:55px 72px; } }
    @media(max-width:1100px) { .sidebar { width:254px; } .shell { margin-left:254px; } .progress-track { left:254px; } main { padding:28px 24px 50px; } .document { padding:35px; } .toolbar { padding:0 24px; } }
    @media(max-width:800px) { .sidebar { transform:translateX(-100%); width:292px; transition:transform .2s; } body.menu-open .sidebar { transform:translateX(0); } .shell { margin-left:0; } .progress-track { left:0; } #menu-toggle { display:inline-block; } .breadcrumb > span { display:none; } .toolbar { height:58px; padding:0 16px; } .progress-track { top:58px; } main { padding:20px 14px 40px; } .document { padding:27px 22px; border-radius:7px; } .document h2 { font-size:25px; } body.menu-open #backdrop { display:block; position:fixed; inset:0; z-index:19; background:#0008; border:0; } .edition { font-size:9px; letter-spacing:.7px; } .tools { gap:5px; } .tool { padding:5px 8px; } body.menu-open { overflow:hidden; } .route-map { padding:12px; } .route-map li { gap:5px; grid-template-columns:1fr 70px 1fr; } .route-place { padding:8px; font-size:10px; } }
    @media(max-width:520px) { .breadcrumb strong { display:none; } }
    @media(prefers-reduced-motion:reduce) { html { scroll-behavior:auto; } *,*::before,*::after { animation:none!important; transition:none!important; } }
    @media print { :root,[data-theme="dark"] { --bg:white; --paper:white; --ink:black; --muted:#555; --line:#ccc; --code:#f5f5f5; --wash:#fafafa; } .sidebar,.toolbar,.progress-track,.edition,.document-footer,.skip,#backdrop { display:none!important; } .shell { margin:0; } main { max-width:none; margin:0; padding:0; } .document { border:0; padding:0; box-shadow:none; } .document[hidden] { display:none!important; } h2,h3 { break-after:avoid; } tr,figure { break-inside:avoid; } a { color:inherit; text-decoration:none; } body { font-size:11pt; } .table-scroll { overflow:visible; } .document h2 { margin-top:30px; } @page { margin:18mm; } }
    @media print { .world-map-viewport { overflow:visible; border:0; } .world-map-viewport svg { min-width:0; width:100%; } .world-map-figure figcaption a { display:none; } }
  </style>
</head>
<body>
  <a class="skip" href="#content">Перейти к документу</a>
  <button id="backdrop" aria-label="Закрыть оглавление" tabindex="-1"></button>
  <aside class="sidebar" aria-label="Навигация по документации">
    <div class="brand"><div class="brand-line"><span class="heart" aria-hidden="true">♥</span><strong>ALICE</strong></div><p>Дизайн игры · рабочая версия</p></div>
    <div class="search-wrap"><label for="search">Поиск по всем документам</label><input id="search" type="search" placeholder="Персонаж, глава, механика…" autocomplete="off"></div>
    <div class="nav-scroll">
      <nav id="document-nav" aria-label="Документы"><p class="nav-label">Библиотека</p>
        <button class="doc-link" data-doc="gdd"><span>01</span>Дизайн игры</button>
        <button class="doc-link" data-doc="foundation"><span>02</span>Сюжетная основа</button>
        <button class="doc-link" data-doc="story"><span>03</span>Основная история</button>
        <button class="doc-link" data-doc="episodes"><span>04</span>Кампания по эпизодам</button>
        <button class="doc-link" data-doc="worldmap"><span>05</span>Карта мира</button>
        <button class="doc-link" data-doc="roadmap"><span>06</span>План разработки</button>
        <button class="doc-link" data-doc="sources"><span>07</span>Источники и права</button>
        <button class="doc-link" data-doc="technical"><span>08</span>Техническая основа</button>
      </nav>
      <nav id="chapter-nav" aria-label="Главы текущего документа"><p class="nav-label">Оглавление</p><ol id="toc"></ol></nav>
      <div id="search-results" hidden><div id="search-status" role="status" aria-live="polite"></div><div id="result-list"></div></div>
    </div>
    <div class="side-footer"><span><i class="status-dot"></i>Проработка сюжета</span><span>v{{VERSION}}</span></div>
  </aside>
  <div class="shell">
    <header class="toolbar"><div class="breadcrumb"><button id="menu-toggle" class="tool" aria-expanded="false" aria-controls="document-nav">Оглавление</button><span>Документация</span><span aria-hidden="true">/</span><strong id="current-title">Дизайн игры</strong></div><div class="tools"><button class="tool" id="theme-toggle" aria-pressed="false">Тёмная тема</button><button class="tool" id="print">Печать</button></div></header>
    <div class="progress-track" aria-hidden="true"><span id="progress"></span></div>
    <main id="content" tabindex="-1"><div class="edition"><span>Алиса в Стране чудес · 2D метроидвания</span><span>Документ v{{VERSION}}</span></div>
      <noscript><p>JavaScript выключен: все документы показаны последовательно. Для поиска используйте поиск браузера.</p></noscript>
      {{DOCUMENTS}}
    </main>
  </div>
  <script>
    (() => {
      'use strict';
      const docs = [...document.querySelectorAll('.document')];
      const toc = document.getElementById('toc');
      const search = document.getElementById('search');
      const themeButton = document.getElementById('theme-toggle');
      const menuButton = document.getElementById('menu-toggle');
      let activeDoc = null;
      let observer = null;
      const searchIndex = [];

      docs.forEach(doc => {
        doc.querySelector('h1')?.setAttribute('data-kicker', doc.dataset.icon + ' / ' + doc.dataset.title);
        let section = null;
        [...doc.children].forEach(element => {
          if (/^H[12]$/.test(element.tagName)) {
            section = { doc: doc.id, target: element.id, title: element.textContent, text: '' };
            searchIndex.push(section);
          } else if (section && element.tagName !== 'FOOTER') {
            section.text += ' ' + element.textContent;
          }
        });
      });

      function closeMenu() {
        document.body.classList.remove('menu-open');
        menuButton.setAttribute('aria-expanded', 'false');
      }

      function updateProgress() {
        const available = document.documentElement.scrollHeight - window.innerHeight;
        document.getElementById('progress').style.width = (available > 0 ? Math.min(100, Math.max(0, window.scrollY / available * 100)) : 100) + '%';
      }

      function showDocument(id) {
        const selected = docs.find(doc => doc.id === id) || docs[0];
        docs.forEach(doc => { doc.hidden = doc !== selected; });
        activeDoc = selected;
        document.getElementById('current-title').textContent = selected.dataset.title;
        document.title = 'Alice — ' + selected.dataset.title;
        document.querySelectorAll('.doc-link').forEach(button => {
          if (button.dataset.doc === selected.id) button.setAttribute('aria-current', 'page');
          else button.removeAttribute('aria-current');
        });
        toc.replaceChildren();
        selected.querySelectorAll('h2,h3').forEach(heading => {
          const li = document.createElement('li');
          if (heading.tagName === 'H3') li.className = 'sub';
          const a = document.createElement('a');
          a.href = '#' + encodeURIComponent(heading.id);
          a.textContent = heading.textContent;
          li.append(a);
          toc.append(li);
        });
        observer?.disconnect();
        if ('IntersectionObserver' in window) {
          observer = new IntersectionObserver(entries => {
            const visible = entries.filter(entry => entry.isIntersecting).sort((a, b) => a.boundingClientRect.top - b.boundingClientRect.top);
            if (!visible.length) return;
            toc.querySelectorAll('a').forEach(a => a.classList.toggle('active', decodeURIComponent(a.hash.slice(1)) === visible[0].target.id));
          }, { rootMargin: '-70px 0px -65% 0px' });
          selected.querySelectorAll('h2,h3').forEach(heading => observer.observe(heading));
        }
        requestAnimationFrame(updateProgress);
      }

      function navigate(hash, push = true) {
        let id;
        try { id = decodeURIComponent(hash.replace(/^#/, '')); } catch { id = 'gdd'; }
        const target = document.getElementById(id);
        const owner = target?.matches('.document') ? target : target?.closest('.document');
        showDocument(owner?.id || 'gdd');
        if (push) history.pushState(null, '', '#' + encodeURIComponent(owner ? id : 'gdd'));
        closeMenu();
        if (owner && target !== owner) {
          target.scrollIntoView({ block: 'start' });
          target.classList.remove('target-flash');
          void target.offsetWidth;
          target.classList.add('target-flash');
        } else window.scrollTo({ top: 0, behavior: 'instant' });
      }

      document.addEventListener('click', event => {
        const button = event.target.closest('[data-doc]');
        if (button) { navigate(button.dataset.doc); return; }
        const anchor = event.target.closest('a[href^="#"]');
        if (anchor && anchor.getAttribute('href') !== '#content') {
          event.preventDefault();
          navigate(anchor.getAttribute('href'));
        }
      });
      window.addEventListener('popstate', () => navigate(location.hash, false));
      window.addEventListener('hashchange', () => navigate(location.hash, false));
      window.addEventListener('scroll', updateProgress, { passive: true });
      window.addEventListener('resize', updateProgress);
      menuButton.addEventListener('click', () => {
        const open = document.body.classList.toggle('menu-open');
        menuButton.setAttribute('aria-expanded', String(open));
      });
      document.getElementById('backdrop').addEventListener('click', closeMenu);
      document.addEventListener('keydown', event => { if (event.key === 'Escape') closeMenu(); });
      document.getElementById('print').addEventListener('click', () => window.print());

      function setTheme(theme) {
        document.documentElement.dataset.theme = theme;
        themeButton.textContent = theme === 'dark' ? 'Светлая тема' : 'Тёмная тема';
        themeButton.setAttribute('aria-pressed', String(theme === 'dark'));
      }
      try { setTheme(localStorage.getItem('alice-reader-theme') || 'light'); } catch { setTheme('light'); }
      themeButton.addEventListener('click', () => {
        const theme = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
        setTheme(theme);
        try { localStorage.setItem('alice-reader-theme', theme); } catch { /* Local file storage may be disabled. */ }
      });

      search.addEventListener('input', () => {
        const query = search.value.trim().toLocaleLowerCase('ru');
        document.getElementById('chapter-nav').hidden = Boolean(query);
        document.getElementById('search-results').hidden = !query;
        const list = document.getElementById('result-list');
        list.replaceChildren();
        if (!query) return;
        const results = searchIndex.filter(item => (item.title + item.text).toLocaleLowerCase('ru').includes(query));
        document.getElementById('search-status').textContent = results.length ? 'Найдено разделов: ' + results.length + (results.length > 25 ? ' · показаны первые 25' : '') : 'Ничего не найдено. Попробуйте другое слово.';
        results.slice(0, 25).forEach(item => {
          const button = document.createElement('button');
          button.className = 'search-result';
          const label = document.createElement('small');
          label.textContent = docs.find(doc => doc.id === item.doc).dataset.title;
          const title = document.createElement('strong');
          title.textContent = item.title;
          const snippet = document.createElement('p');
          const start = Math.max(0, item.text.toLocaleLowerCase('ru').indexOf(query) - 45);
          snippet.textContent = (start ? '…' : '') + item.text.slice(start, start + 150).trim() + '…';
          button.append(label, title, snippet);
          button.addEventListener('click', () => navigate(item.target));
          list.append(button);
        });
      });
      navigate(location.hash || '#gdd', false);
    })();
  </script>
</body>
</html>
